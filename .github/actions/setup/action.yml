# pnpm, Node and `pnpm install` in one step, shared by every CI job so a Node
# or cache change is a one-place edit.
#
# It does not check out the repository: a local action is read from the
# workspace, so every caller runs `actions/checkout` first. That also lets
# each job choose its own clone depth. `runs-on` stays in each job, since a
# composite action cannot set it.
name: Setup
description: Install pnpm, Node, and the workspace dependencies.

runs:
  using: composite
  steps:
    # No `version:`: the action reads `packageManager` from package.json, so
    # CI and local pnpm stay the same version.
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
