name: Propose a workflow
description: Share a result-based workflow across tools when you cannot open the pull request yourself.
title: "Workflow: <the result it reaches>"
labels: [catalog, workflow]
body:
  - type: input
    id: title
    attributes:
      label: Title, phrased as the result
      placeholder: Email buyers at newly funded companies
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Your GitHub login
      description: Workflows are by people; the page credits `@you`.
    validations:
      required: true
  - type: dropdown
    id: motion
    attributes:
      label: Motion
      description: The one go-to-market motion it serves.
      options:
        - Outbound
        - Inbound
        - Product-led
        - Retention
        - Not sure
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What the user has when the run ends, such as a table, drafts, records or sent emails. No promised results.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: Up to ten. Each step names one tool (`company/function`) and what to do with it, or no tool when the agent does it itself (writing a draft).
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Inputs the agent should ask the user for
      placeholder: "`target_segment`: the kind of company to watch"
