name: Request a company or tool
description: Ask for a company or tool to be listed when you cannot open the pull request yourself.
title: "Add <company>"
labels: [catalog, company]
body:
  - type: input
    id: company
    attributes:
      label: Company
      description: Name and domain.
      placeholder: Clay (clay.com)
    validations:
      required: true
  - type: textarea
    id: access
    attributes:
      label: Ways in
      description: The official MCP server URL or install command, the CLI's install command and binary, the API base URL. Link the docs for each.
    validations:
      required: true
  - type: textarea
    id: functions
    attributes:
      label: Functions an agent can call
      description: One line per function, with the exact call per way in (MCP tool name, CLI command, `METHOD /path`) and the docs page that names it.
    validations:
      required: true
  - type: textarea
    id: verified
    attributes:
      label: What you have verified yourself
      description: Which of these have you used yourself, and which come only from the vendor's docs? Maintainers check the rest before merging.
