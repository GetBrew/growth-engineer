# Keep GitHub Actions current.
#
# WHY ONLY ACTIONS. The npm tree is managed through pnpm and the lockfile, with
# its own review flow; adding it here opens dozens of PRs a week that each cost
# CI minutes and get rubber-stamped. Actions are the real gap: every `uses:`
# pins a floating major tag, so nothing ever tells you a v5 exists, that an
# action was deprecated, or that one shipped a security fix. That is the class
# of drift no human notices until a runner image change breaks a workflow.
#
# MONTHLY AND GROUPED, deliberately. A weekly per-action PR storm is how these
# configs end up muted. One batched PR a month is small enough to actually read.
version: 2

updates:
  - package-ecosystem: github-actions
    # `/` covers .github/workflows only; the composite setup action pins
    # actions of its own and needs naming.
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore(ci)'
    labels: ['ci', 'dependencies']
    open-pull-requests-limit: 3
