# Keeps GitHub Actions current: one grouped pull request a month.
#
# Only Actions. npm dependencies are managed through pnpm and the lockfile;
# listing them here would open dozens of pull requests a week. Every `uses:`
# pins a floating major tag, so without this nothing says when a new major,
# a deprecation or a security fix ships.
version: 2

updates:
  - package-ecosystem: github-actions
    # `/` covers .github/workflows only; the composite setup action pins
    # actions of its own and needs naming.
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore(ci)'
    labels: ['ci', 'dependencies']
    open-pull-requests-limit: 3
