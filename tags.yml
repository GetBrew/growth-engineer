# The catalog vocabulary: every tag, in one file. The key is
# <namespace>:<slug> (capability:enrich-contacts).
#
#   capability  what a tool does. Every tool names one (`capability:` in its
#               header); a workflow gets its tools' capabilities automatically.
#   category    what kind of company it is (`category:` in company.md).
#   channel     where a workflow reaches people (`tags:` in its header).
#   motion      which go-to-market motion a workflow serves (`tags:` too).
#
# One more namespace is computed, never written here: has:mcp|cli|api, the
# ways in. `label` is what the site shows; `synonyms` feed search, so
# "enrichment" finds every tool that enriches. Slugs are lowercase letters,
# digits and hyphens. Reuse a tag whenever it fits: shared words are what
# make three vendors comparable. Add a new one in the same pull request as
# the first file that needs it.

